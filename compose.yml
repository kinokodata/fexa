# Fexa - 基本情報技術者試験過去問データベース
# Docker Compose設定（V2形式）
# Supabase直接接続版

services:
  # フロントエンド（Next.js）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fexa-frontend
    ports:
      - "43000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:43001}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    working_dir: /app
    command: npm run dev
    restart: unless-stopped

  # ローカル開発用APIサーバー（本番はVercel使用）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fexa-backend
    ports:
      - "43001:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Supabase接続情報
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      # Supabase Storage設定
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET}
      SUPABASE_STORAGE_ACCESS_KEY_ID: ${SUPABASE_STORAGE_ACCESS_KEY_ID}
      SUPABASE_STORAGE_SECRET_ACCESS_KEY: ${SUPABASE_STORAGE_SECRET_ACCESS_KEY}
      # APIサーバー設定
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:43000}
    volumes:
      - ./backend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev
    restart: unless-stopped

  # Markdownエクスポートツール
  export-markdown:
    build:
      context: ./tools/export-markdown
      dockerfile: Dockerfile
    container_name: fexa-export-markdown
    environment:
      # Supabase接続情報
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET}
    volumes:
      - ./tools/export-markdown:/app
      - /app/node_modules
      - ./pdfs:/pdfs  # PDFファイル共有
    working_dir: /app
    profiles:
      - tools

  # 解答エクスポートツール
  export-answer:
    build:
      context: ./tools/export-answer
      dockerfile: Dockerfile
    environment:
      # Supabase接続情報
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_KEY}
      NODE_ENV: development
    volumes:
      - ./tools/export-answer:/app
      - /app/node_modules
      - ./pdfs:/app/pdfs  # PDFファイル共有
      - ./.env.local:/app/.env.local:ro
    working_dir: /app
    profiles:
      - tools

  # 問題演習アプリケーション（Next.js）
  exam-app:
    build:
      context: ./exam-app
      dockerfile: Dockerfile
    container_name: fexa-exam-app
    ports:
      - "43002:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:43001}
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://localhost:43001}
    volumes:
      - ./exam-app:/app
      - /app/node_modules
      - /app/.next
    working_dir: /app
    command: npm run dev
    depends_on:
      - backend
    restart: unless-stopped

  # 選択肢修復ツール
  fix-choices:
    build:
      context: ./tools/fix-missing-choices
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    volumes:
      - ./tools/fix-missing-choices:/app
      - ./pdfs:/data/pdfs:ro  # PDFディレクトリを読み取り専用でマウント
      - /app/node_modules
    working_dir: /app
    profiles:
      - tools

  # タグ抽出ツール
  extract-tags:
    build:
      context: ./tools/extract-tags
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
    volumes:
      - ./tools/extract-tags:/app
      - /app/node_modules
    working_dir: /app
    profiles:
      - tools

networks:
  default:
    name: fexa_network